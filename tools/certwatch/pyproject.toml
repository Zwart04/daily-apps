[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certwatch"
version = "1.0.0"
description = "SSL/TLS certificate expiry checker — beautiful CLI, bulk async checks, JSON output, Nagios-compatible"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ssl", "tls", "certificate", "expiry", "monitoring", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "rich>=13.0",
    "cryptography>=42.0",
]

[project.scripts]
certwatch = "certwatch.cli:main"

[project.urls]
Homepage = "https://github.com/Zwart04/certwatch"
Source = "https://github.com/Zwart04/certwatch"

[tool.setuptools.packages.find]
where = ["src"]
