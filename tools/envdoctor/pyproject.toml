[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor"
version = "1.0.0"
description = "Environment Variable Diagnostic Tool — scan, validate, and document every env var across your project."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["environment-variables", "dotenv", "cli", "devtools", "diagnostics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Zwart04/envdoctor"
Repository = "https://github.com/Zwart04/envdoctor"

[project.scripts]
envdoctor = "envdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["envdoctor*"]
