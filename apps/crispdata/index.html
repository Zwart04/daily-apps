<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrispData — Smart Data Cleaner & Converter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ea5e9'/><text x='16' y='22' text-anchor='middle' font-size='18' font-weight='bold' fill='white'>CD</text></svg>">
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<style>
/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #09090b; color: #f4f4f5; min-height: 100dvh;
}

/* Nav */
nav {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 20px; border-bottom: 1px solid #27272a;
  background: #09090b;
}
nav .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.03em; }
nav .logo span { color: #38bdf8; }
nav .version { font-weight: 400; font-size: 12px; color: #71717a; }

/* Layout */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  height: calc(100dvh - 56px);
}
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; height: auto; }
  .panel-input { height: 50dvh; border-right: none !important; border-bottom: 1px solid #27272a; }
  .panel-output { height: 50dvh; }
}

/* Panels */
.panel-input {
  border-right: 1px solid #27272a;
  display: flex; flex-direction: column;
  background: #18181b;
}
.panel-output {
  display: flex; flex-direction: column;
  background: #09090b;
}
.panel-header {
  padding: 8px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  background: #27272a; color: #a1a1aa; border-bottom: 1px solid #3f3f46;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
}
.panel-header .left-group,
.panel-header .right-group { display: flex; align-items: center; gap: 6px; }

/* Input textarea */
#inputArea {
  width: 100%; flex: 1; border: none; outline: none; resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6;
  padding: 16px; background: transparent; color: #e4e4e7; tab-size: 2;
}
#inputArea::placeholder { color: #52525b; }

/* Output area */
#outputArea {
  width: 100%; flex: 1; border: none; outline: none; resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6;
  padding: 16px; background: transparent; color: #e4e4e7; tab-size: 2;
}
#outputArea::placeholder { color: #52525b; }

/* Table preview */
#tablePreview {
  flex: 1; overflow: auto; padding: 16px;
}
#tablePreview table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
#tablePreview th {
  text-align: left; padding: 8px 12px;
  background: #27272a; color: #a1a1aa;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
  border-bottom: 1px solid #3f3f46; position: sticky; top: 0; z-index: 1;
}
#tablePreview td {
  padding: 6px 12px; border-bottom: 1px solid #1f1f23; color: #d4d4d8;
  max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#tablePreview tr:hover td { background: #1f1f23; }
#tablePreview .empty-state {
  text-align: center; padding: 60px 20px; color: #52525b;
}
#tablePreview .empty-state svg { width: 48px; height: 48px; margin: 0 auto 12px; opacity: 0.3; }

/* Detection badge */
.detection-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
}
.badge-json { background: #1e3a5f; color: #93c5fd; }
.badge-csv { background: #14532d; color: #86efac; }
.badge-markdown { background: #5b1e3a; color: #f9a8d4; }
.badge-html { background: #5b2e0e; color: #fdba74; }
.badge-tsv { background: #1e1e5f; color: #a5b4fc; }
.badge-detected { background: #27272a; color: #a1a1aa; }
.badge-unknown { background: #27272a; color: #71717a; }

/* Buttons */
.btn {
  padding: 6px 14px; border: 1px solid #3f3f46; border-radius: 8px;
  font-size: 12px; font-weight: 500; cursor: pointer;
  background: #18181b; color: #d4d4d8;
  transition: all 0.12s; white-space: nowrap; font-family: inherit;
}
.btn:hover { background: #27272a; border-color: #52525b; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: #0ea5e9; border-color: #0ea5e9; color: white; }
.btn-primary:hover { background: #0284c7; border-color: #0284c7; }
.btn-success { background: #22c55e; border-color: #22c55e; color: white; }
.btn-success:hover { background: #16a34a; border-color: #16a34a; }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* Format tabs */
.format-tabs {
  display: flex; gap: 4px; padding: 8px 16px;
  border-bottom: 1px solid #27272a; flex-wrap: wrap;
}
.format-tab {
  padding: 5px 12px; border: 1px solid #3f3f46; border-radius: 6px;
  font-size: 11px; font-weight: 500; cursor: pointer;
  background: transparent; color: #71717a;
  transition: all 0.12s; font-family: inherit;
}
.format-tab:hover { background: #27272a; color: #d4d4d8; }
.format-tab.active { background: #0ea5e9; border-color: #0ea5e9; color: white; }

/* Stats */
.stats {
  display: flex; gap: 16px; padding: 6px 16px;
  font-size: 11px; color: #71717a;
}
.stat-item { display: flex; align-items: center; gap: 4px; }
.stat-item strong { color: #d4d4d8; font-weight: 600; }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #18181b; border: 1px solid #3f3f46; border-radius: 8px;
  padding: 8px 20px; font-size: 13px; color: #d4d4d8;
  opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 99999;
}
#toast.show { opacity: 1; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #52525b; }

/* Transitions */
.tab-content {
  display: none;
}
.tab-content.active {
  display: flex; flex-direction: column; flex: 1;
}

/* Responsive mode */
@media (max-width: 900px) {
  .panel-input { height: 40dvh; }
  .panel-output { height: 60dvh; }
}
</style>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="#0ea5e9"/><path d="M8 9h12M8 14h12M8 19h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div><span>CrispData</span><span class="version">v1</span></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="detectionBadge" class="detection-badge badge-detected" style="font-size:11px">Waiting for input</span>
    <button class="btn" onclick="clearAll()" title="Clear all">Clear</button>
    <button class="btn" onclick="loadSample()">Sample</button>
  </div>
</nav>

<!-- Main Grid -->
<div class="main-grid">

  <!-- Left: Input Panel -->
  <div class="panel-input">
    <div class="panel-header">
      <div class="left-group">Paste Data</div>
      <div class="right-group">
        <span id="inputStats" class="stats" style="padding:0;font-size:10px">0 rows</span>
        <button class="btn btn-sm" onclick="pasteFromClipboard()">Paste</button>
      </div>
    </div>
    <textarea id="inputArea" placeholder='Paste your data here...&#10;&#10;CrispData auto-detects:&#10;  - Markdown tables&#10;  - JSON arrays&#10;  - CSV / TSV&#10;  - HTML tables&#10;  - Pipe/text delimited&#10;&#10;Invisible characters are automatically cleaned.'></textarea>
  </div>

  <!-- Right: Output Panel -->
  <div class="panel-output" id="outputPanel">
    <!-- Format Conversion Tabs -->
    <div class="format-tabs">
      <button class="format-tab active" data-format="table" onclick="switchOutputTab('table')">Table View</button>
      <button class="format-tab" data-format="markdown" onclick="switchOutputTab('markdown')">Markdown</button>
      <button class="format-tab" data-format="json" onclick="switchOutputTab('json')">JSON</button>
      <button class="format-tab" data-format="csv" onclick="switchOutputTab('csv')">CSV</button>
      <button class="format-tab" data-format="html" onclick="switchOutputTab('html')">HTML Table</button>
    </div>

    <!-- Stats bar -->
    <div class="stats">
      <span class="stat-item">Rows: <strong id="rowCount">0</strong></span>
      <span class="stat-item">Columns: <strong id="colCount">0</strong></span>
      <span class="stat-item">Format: <strong id="detectedFormat">-</strong></span>
      <span style="flex:1"></span>
      <span class="stat-item" id="cleanStats" style="display:none">Cleaned: <strong id="cleanCount">0</strong> chars</span>
    </div>

    <!-- Tab content areas -->
    <div id="tabTable" class="tab-content active">
      <div id="tablePreview">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          <p style="color:#52525b;font-size:13px">Paste data on the left to see a preview</p>
        </div>
      </div>
    </div>

    <div id="tabMarkdown" class="tab-content">
      <textarea id="outputArea" readonly placeholder="Markdown table will appear here..."></textarea>
    </div>
    <div id="tabJson" class="tab-content">
      <textarea id="jsonOutputArea" readonly placeholder="JSON will appear here..."></textarea>
    </div>
    <div id="tabCsv" class="tab-content">
      <textarea id="csvOutputArea" readonly placeholder="CSV will appear here..."></textarea>
    </div>
    <div id="tabHtml" class="tab-content">
      <textarea id="htmlOutputArea" readonly placeholder="HTML table will appear here..."></textarea>
    </div>

    <!-- Action bar for copy -->
    <div style="display:flex;gap:8px;padding:8px 16px;border-top:1px solid #27272a;justify-content:flex-end;flex-shrink:0">
      <button class="btn btn-success btn-sm" id="copyBtn" onclick="copyCurrentOutput()">Copy</button>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ========================
// === STATE
// ========================
let parsedData = null;      // Array of objects (tabular)
let headers = [];
let rows = [];
let currentTab = 'table';
let detectedFormat = null;  // 'json', 'csv', 'tsv', 'markdown', 'html', 'unknown'
let totalCleaned = 0;

// ========================
// === INPUT HANDLING
// ========================
const inputArea = document.getElementById('inputArea');
let inputTimer = null;

inputArea.addEventListener('input', function() {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(processInput, 350);
});

inputArea.addEventListener('paste', function() {
  setTimeout(processInput, 50);
});

function pasteFromClipboard() {
  navigator.clipboard.readText().then(text => {
    if (text) {
      inputArea.value = text;
      processInput();
      showToast('Pasted from clipboard');
    }
  }).catch(() => {
    showToast('Click the textarea and press Ctrl+V');
    inputArea.focus();
  });
}

// ========================
// === SMART CLEAN
// ========================
function smartClean(text) {
  let cleaned = text;
  let count = 0;
  const before = cleaned.length;

  // 1. Remove BOM
  cleaned = cleaned.replace(/\uFEFF/g, '');
  // 2. Remove zero-width spaces
  cleaned = cleaned.replace(/[\u200B-\u200D\u200E\u200F\u2060\u2061\u2062\u2063\u2064]/g, '');
  // 3. Remove soft hyphen
  cleaned = cleaned.replace(/\u00AD/g, '');
  // 4. Normalize line endings (CRLF -> LF, CR -> LF)
  cleaned = cleaned.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // 5. Normalize smart/curly quotes to straight quotes
  cleaned = cleaned.replace(/[\u2018\u2019]/g, "'");
  cleaned = cleaned.replace(/[\u201C\u201D]/g, '"');
  // 6. Remove non-printable chars (except newlines, tabs)
  cleaned = cleaned.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  // 7. Trim trailing whitespace on each line
  cleaned = cleaned.split('\n').map(line => line.replace(/\s+$/, '')).join('\n');
  // 8. Remove leading/trailing blank lines
  cleaned = cleaned.replace(/^\n+/, '').replace(/\n+$/, '');
  // 9. Normalize multiple consecutive blank lines to one
  cleaned = cleaned.replace(/\n{3,}/g, '\n\n');

  count = before - cleaned.length + (text.length - before);
  totalCleaned += count;

  return cleaned;
}

// ========================
// === FORMAT DETECTION
// ========================
function detectFormat(text) {
  const trimmed = text.trim();
  if (!trimmed) return 'unknown';

  // JSON array of objects
  if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
    try {
      const parsed = JSON.parse(trimmed);
      if (Array.isArray(parsed) && parsed.length > 0 && typeof parsed[0] === 'object') return 'json';
      if (Array.isArray(parsed) && parsed.length === 0) return 'json';
      // Single object -> wrap as array
      if (!Array.isArray(parsed) && typeof parsed === 'object') return 'json';
    } catch(e) {}
  }

  // HTML table
  if (/<table[\s>]/i.test(trimmed)) return 'html';

  // Detect lines to analyze structure
  const lines = trimmed.split('\n').filter(l => l.trim());
  if (lines.length === 0) return 'unknown';

  // Markdown table: has pipe characters, second line has dashes
  const pipeLines = lines.filter(l => l.includes('|'));
  if (pipeLines.length >= 2) {
    const secondLine = lines[1] || '';
    if (/^[\s|:]+[-]+[\s|:]+/.test(secondLine) && secondLine.includes('---')) {
      return 'markdown';
    }
  }

  // Count potential delimiters in first few data lines
  const sampleLines = lines.slice(0, 10);
  let commaCounts = 0, tabCounts = 0, pipeCounts = 0, semicolonCounts = 0;

  sampleLines.forEach(l => {
    const clean = l.replace(/("(?:[^"\\]|\\.)*")/g, ''); // ignore quoted content
    if (clean.includes(',') && l.split(',').length >= 3) commaCounts++;
    if (clean.includes('\t') && l.split('\t').length >= 2) tabCounts++;
    if (l.includes('|') && l.split('|').length >= 3) pipeCounts++;
    if (clean.includes(';') && l.split(';').length >= 3) semicolonCounts++;
  });

  // Decide by most consistent delimiter
  const scores = [
    { fmt: 'csv', count: commaCounts },
    { fmt: 'tsv', count: tabCounts },
    { fmt: 'pipe', count: pipeCounts },
    { fmt: 'semicolon', count: semicolonCounts },
  ];
  scores.sort((a, b) => b.count - a.count);

  if (scores[0].count >= 2) return scores[0].fmt;
  if (commaCounts >= 1) return 'csv'; // single line with commas might be CSV header

  return 'unknown';
}

// ========================
// === PARSING FUNCTIONS
// ========================
function parseMarkdown(text) {
  const lines = text.trim().split('\n');
  // First line = header
  const headerLine = lines[0];
  // Skip second line (separator)
  const dataLines = lines.slice(2);

  const headers = headerLine.split('|').map(h => h.trim()).filter(h => h);
  const rows = [];

  dataLines.forEach(line => {
    const cols = line.split('|').map(c => c.trim());
    // Remove first/last if empty (from leading/trailing pipe)
    if (cols.length > 0 && cols[0] === '') cols.shift();
    if (cols.length > 0 && cols[cols.length - 1] === '') cols.pop();
    if (cols.length === 0) return;
    // Pad or trim to headers length
    while (cols.length < headers.length) cols.push('');
    rows.push(cols.slice(0, headers.length));
  });

  return { headers, rows };
}

function parseCSV(text, delimiter = ',') {
  const lines = text.trim().split('\n');
  if (lines.length === 0) return { headers: [], rows: [] };

  function parseLine(line, delim) {
    const result = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (i + 1 < line.length && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          current += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === delim) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
    }
    result.push(current.trim());
    return result;
  }

  const headers = parseLine(lines[0], delimiter);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseLine(lines[i], delimiter);
    // Pad or trim
    while (cols.length < headers.length) cols.push('');
    rows.push(cols.slice(0, headers.length));
  }

  return { headers, rows };
}

function parseHTMLTable(text) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/html');
  const table = doc.querySelector('table');
  if (!table) return { headers: [], rows: [] };

  const headers = [];
  const headerRow = table.querySelector('thead tr, tr:first-child');
  if (headerRow) {
    headerRow.querySelectorAll('th, td').forEach(th => {
      headers.push(th.textContent.trim());
    });
  }

  const rows = [];
  const bodyRows = table.querySelectorAll('tbody tr, tr');
  bodyRows.forEach((tr, idx) => {
    if (idx === 0 && !table.querySelector('thead') && !table.querySelector('tbody')) {
      // Assume first row is header if no thead/tbody
      return;
    }
    const cols = [];
    tr.querySelectorAll('td, th').forEach(td => {
      cols.push(td.textContent.trim());
    });
    if (cols.length > 0) rows.push(cols);
  });

  return { headers, rows };
}

function parsePipe(text) {
  // Same as markdown but without separator line
  return parseCSV(text, '|');
}

function parseJSON(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch(e) {
    // Try to fix common JSON issues
    let fixed = text
      .replace(/,(\s*[\]}])/g, '$1')  // trailing commas
      .replace(/'/g, '"')              // single quotes -> double
      .replace(/([{,]\s*)(\w+)(\s*:)/g, '$1"$2"$3'); // unquoted keys
    try {
      data = JSON.parse(fixed);
    } catch(e2) {
      return null;
    }
  }

  if (!Array.isArray(data)) {
    if (typeof data === 'object' && data !== null) {
      data = [data];
    } else {
      return null;
    }
  }

  if (data.length === 0) return { headers: [], rows: [] };

  // Extract headers from object keys
  const headers = Object.keys(data[0]);
  const rows = data.map(item => headers.map(h => String(item[h] ?? '')));

  return { headers, rows };
}

// ========================
// === MAIN PROCESS
// ========================
function processInput() {
  let raw = inputArea.value;
  if (!raw || !raw.trim()) {
    clearOutput();
    return;
  }

  // Clean
  totalCleaned = 0;
  const cleaned = smartClean(raw);

  // Detect format
  detectedFormat = detectFormat(cleaned);

  // Parse based on format
  let result = null;
  let formatLabel = 'Unknown';

  switch (detectedFormat) {
    case 'json':
      result = parseJSON(cleaned);
      formatLabel = 'JSON';
      break;
    case 'markdown':
      result = parseMarkdown(cleaned);
      formatLabel = 'Markdown Table';
      break;
    case 'csv':
      result = parseCSV(cleaned, ',');
      formatLabel = 'CSV';
      break;
    case 'tsv':
      result = parseCSV(cleaned, '\t');
      formatLabel = 'TSV';
      break;
    case 'html':
      result = parseHTMLTable(cleaned);
      formatLabel = 'HTML Table';
      break;
    case 'pipe':
      result = parsePipe(cleaned);
      formatLabel = 'Pipe-delimited';
      break;
    default:
      // Try comma as last resort
      result = parseCSV(cleaned, ',');
      formatLabel = 'CSV (guessed)';
      break;
  }

  if (!result || !result.headers || result.headers.length === 0) {
    // If no structured data found, show raw
    clearOutput();
    document.getElementById('detectedFormat').textContent = 'Unstructured';
    updateDetectionBadge('unknown');
    inputArea.value = cleaned; // show cleaned version
    showToast('Could not detect tabular data');
    return;
  }

  headers = result.headers;
  rows = result.rows;
  parsedData = rows.map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i]; });
    return obj;
  });

  // Update UI
  inputArea.value = cleaned;
  updateStats();
  updateDetectionBadge(detectedFormat);
  renderAllTabs();
  switchOutputTab(currentTab);
}

function clearOutput() {
  headers = [];
  rows = [];
  parsedData = null;
  document.getElementById('rowCount').textContent = '0';
  document.getElementById('colCount').textContent = '0';
  document.getElementById('detectedFormat').textContent = '-';
  document.getElementById('tablePreview').innerHTML =
    `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
      <p style="color:#52525b;font-size:13px">Paste data on the left to see a preview</p>
    </div>`;
  document.getElementById('outputArea').value = '';
  document.getElementById('jsonOutputArea').value = '';
  document.getElementById('csvOutputArea').value = '';
  document.getElementById('htmlOutputArea').value = '';
  document.getElementById('detectionBadge').textContent = 'Waiting for input';
  document.getElementById('detectionBadge').className = 'detection-badge badge-detected';
  document.getElementById('cleanStats').style.display = 'none';
}

// ========================
// === UI UPDATES
// ========================
function updateStats() {
  document.getElementById('rowCount').textContent = rows.length;
  document.getElementById('colCount').textContent = headers.length;
  const fmtNames = { json: 'JSON', csv: 'CSV', tsv: 'TSV', markdown: 'Markdown', html: 'HTML Table', pipe: 'Pipe-delimited', unknown: 'Unknown' };
  document.getElementById('detectedFormat').textContent = fmtNames[detectedFormat] || detectedFormat;

  if (totalCleaned > 0) {
    document.getElementById('cleanStats').style.display = 'inline';
    document.getElementById('cleanCount').textContent = totalCleaned;
  } else {
    document.getElementById('cleanStats').style.display = 'none';
  }
}

function updateDetectionBadge(fmt) {
  const badge = document.getElementById('detectionBadge');
  const fmtNames = { json: 'JSON', csv: 'CSV', tsv: 'TSV', markdown: 'Markdown', html: 'HTML', pipe: 'Pipe', unknown: 'Unknown' };
  const badgeClasses = { json: 'badge-json', csv: 'badge-csv', tsv: 'badge-tsv', markdown: 'badge-markdown', html: 'badge-html', pipe: 'badge-tsv', unknown: 'badge-unknown' };

  if (headers.length > 0) {
    badge.textContent = fmtNames[fmt] || 'Detected';
    badge.className = `detection-badge ${badgeClasses[fmt] || 'badge-detected'}`;
  } else {
    badge.textContent = 'Waiting for input';
    badge.className = 'detection-badge badge-detected';
  }
}

// ========================
// === RENDER TABS
// ========================
function renderAllTabs() {
  if (!headers.length) return;

  // Table view
  renderTable();

  // Markdown
  document.getElementById('outputArea').value = toMarkdown();

  // JSON
  document.getElementById('jsonOutputArea').value = toJSON();

  // CSV
  document.getElementById('csvOutputArea').value = toCSV();

  // HTML
  document.getElementById('htmlOutputArea').value = toHTML();
}

function renderTable() {
  const container = document.getElementById('tablePreview');
  let html = '<div style="max-height:100%;overflow:auto"><table><thead><tr>';
  html += headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  html += '</tr></thead><tbody>';
  html += rows.map(row => {
    return '<tr>' + row.map(cell => `<td title="${escapeHtml(cell)}">${escapeHtml(cell)}</td>`).join('') + '</tr>';
  }).join('');
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function toMarkdown() {
  if (!headers.length) return '';
  // Header
  let md = '| ' + headers.join(' | ') + ' |\n';
  // Separator
  md += '| ' + headers.map(() => '---').join(' | ') + ' |\n';
  // Rows
  rows.forEach(row => {
    md += '| ' + row.map(cell => cell.replace(/\|/g, '\\|')).join(' | ') + ' |\n';
  });
  return md;
}

function toJSON() {
  if (!parsedData) return '[]';
  return JSON.stringify(parsedData, null, 2);
}

function toCSV() {
  if (!headers.length) return '';
  const escapeCSV = (val) => {
    const s = String(val);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  let csv = headers.map(escapeCSV).join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(escapeCSV).join(',') + '\n';
  });
  return csv;
}

function toHTML() {
  if (!headers.length) return '';
  let html = '<table>\n  <thead>\n    <tr>\n';
  headers.forEach(h => {
    html += `      <th>${escapeHtml(h)}</th>\n`;
  });
  html += '    </tr>\n  </thead>\n  <tbody>\n';
  rows.forEach(row => {
    html += '    <tr>\n';
    row.forEach(cell => {
      html += `      <td>${escapeHtml(cell)}</td>\n`;
    });
    html += '    </tr>\n';
  });
  html += '  </tbody>\n</table>';
  return html;
}

// ========================
// === TAB SWITCHING
// ========================
function switchOutputTab(tab) {
  currentTab = tab;

  // Update tab buttons
  document.querySelectorAll('.format-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.format === tab);
  });

  // Show/hide content
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const target = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (target) target.classList.add('active');

  // Update copy button context
  const copyBtn = document.getElementById('copyBtn');
  const names = { table: 'Table', markdown: 'Markdown', json: 'JSON', csv: 'CSV', html: 'HTML Table' };
  copyBtn.textContent = 'Copy ' + (names[tab] || tab);
}

// ========================
// === COPY
// ========================
function getCurrentOutput() {
  switch (currentTab) {
    case 'table': return toMarkdown(); // fallback to markdown for copy
    case 'markdown': return document.getElementById('outputArea').value;
    case 'json': return document.getElementById('jsonOutputArea').value;
    case 'csv': return document.getElementById('csvOutputArea').value;
    case 'html': return document.getElementById('htmlOutputArea').value;
    default: return '';
  }
}

function copyCurrentOutput() {
  const text = getCurrentOutput();
  if (!text) { showToast('Nothing to copy'); return; }

  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard!');
  }).catch(() => {
    // Fallback
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    showToast('Copied to clipboard!');
  });
}

// ========================
// === UTILITY
// ========================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ========================
// === KEYBOARD SHORTCUTS
// ========================
document.addEventListener('keydown', function(e) {
  const ctrl = e.ctrlKey || e.metaKey;

  if (e.key === 'Escape') {
    clearAll();
    return;
  }

  // Tab switching
  if (ctrl && e.key >= '1' && e.key <= '5') {
    e.preventDefault();
    const tabs = ['table', 'markdown', 'json', 'csv', 'html'];
    const idx = parseInt(e.key) - 1;
    if (tabs[idx]) switchOutputTab(tabs[idx]);
    return;
  }

  if (ctrl && e.key === 'c' && !e.target.closest('textarea, input')) {
    if (currentTab !== 'table') {
      copyCurrentOutput();
      e.preventDefault();
    }
    return;
  }
});
